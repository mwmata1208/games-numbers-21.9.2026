<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>סיימון</title>
    <style>
        body{
            background-color: #befbf9;
        }
        .red{
            background-color: red;
            width: 300px;
            height: 300px;
        }
        .blue{
            background-color: blue;
            width: 300px;
            height: 300px;
            border-radius: 50%;
        }
        .green{
            background-color: green;
            width: 300px;
            height: 300px;
            /*transform: rotate(45deg);*/
            clip-path: polygon(50% 0%, 0% 50%,50% 100% , 100% 50%);
        }
        .yellow{
            background-color: yellow;
            width: 300px;
            height:300px; /* ≈ width * 0.866 for equilateral */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);

        }
        #btn_panel{
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        .smallBtn{
            transform: scale(0.5);
        }
        .inBox{
            width: 90%;
            height: 90%;
        }
        #game_viewer{
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        td{
            width: 30px;
            height: 30px;
            border: 2px solid black;
        }
        table{
            margin: 0 auto;
        }
        #gameDiv{
            display: none;
        }
    </style>
</head>
<body>
<div id="startDiv">
    <button onclick="startNewGame()">start</button>
</div>
<div id="gameDiv">
    <div id="placements"></div>
    <div id="game_viewer"></div>
    <div id="btn_panel">
        <div onclick="colorPressed('red')"    class="red    smallBtn"></div>
        <div onclick="colorPressed('blue')"   class="blue   smallBtn"></div>
        <div onclick="colorPressed('green')"  class="green  smallBtn"></div>
        <div onclick="colorPressed('yellow')" class="yellow smallBtn"></div>
    </div>
</div>
<script>
    const game_viewer=document.getElementById("game_viewer");
    let options=[
        {letter:"R",word:"red",tone:293.66},//D4
        {letter:"B",word:"blue",tone:329.63},//E4
        {letter:"G",word:"green",tone:349.23},//F4
        {letter:"Y",word:"yellow",tone:392.00},//G4
    ];
    let guess_str="";
    let rezef_str="";
    let rezef=[];
    let rezef_tone=[];
    let rezef_index=0;

    let colorTime=500;
    let breakTime=200;
    let colorsNum = 5;
    let currentBox=0;
    let errCount=0;
    function playNote(frequency = 440, duration = 1) {
        // 1. Create the audio context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 2. Create an oscillator node (the sound generator)
        const oscillator = audioCtx.createOscillator();

        // 3. Create a gain node (controls volume and prevents clipping clicks)
        const gainNode = audioCtx.createGain();

        // Configure oscillator type ('sine', 'square', 'sawtooth', 'triangle') and pitch
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency; // Value in Hz

        // Smoothly fade out the sound at the end to prevent an abrupt popping sound
        gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration/1000);

        // Connect the nodes: Oscillator -> Gain -> Speakers
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // Start playing immediately and stop after the duration
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    }

    function colorPressed(color){
        let cls="";
        let ltr_arr=options.filter((x)=> {
            return x.word === color
        });
        let lttr=ltr_arr[0]?.letter ?? "";
        guess_str += lttr;
        console.log(guess_str);
        playNote(ltr_arr[0]?.tone ?? 0 , 500)
        switch(color){
            case "red":     cls="red";      break;
            case "green":   cls="green";    break;
            case "blue":    cls="blue";     break;
            case "yellow":  cls="yellow";   break;
        }
        let destination = document.getElementById(`cell_${currentBox++}`);
        let dv=document.createElement("div");
        dv.className=cls+" inBox";
        destination.innerHTML="";
        destination.appendChild(dv);
        if (currentBox === colorsNum){
            if (rezef_str === guess_str) {
                setTimeout(startPhase,500);
            }
            else {
                errCount++;
                if (errCount >= 5)
                    setTimeout(endGame,500);
                else
                    setTimeout(repeatPhase,500);
            }
        }
    }
    function createPlacement(){
        document.getElementById("placements").innerHTML="";
        let tbl=document.createElement("table");
        let tr=document.createElement("tr");
        for (let i=0;i<colorsNum;i++){
            let td=document.createElement("td");
            td.id = `cell_${i}`;
            tr.appendChild(td);
        }
        tbl.appendChild(tr);
        document.getElementById("placements").appendChild(tbl);
        currentBox=0;
    }

    function fillRezef(){
        rezef_str="";
        for (let i=0;i<colorsNum;i++){
            let wordIdx=Math.floor(Math.random()*(options.length));
            rezef.push(options[wordIdx].word);
            rezef_tone.push(options[wordIdx].tone);
            rezef_str += options[wordIdx].letter;
        }
        console.log(rezef_str)
    }
    function colorStep(){
        game_viewer.className="";
        game_viewer.classList.add(rezef[rezef_index++]);
        playNote(rezef_tone[rezef_index-1], colorTime)
        setTimeout(breakStep, colorTime);
    }
    function breakStep(){
        game_viewer.className="";
        if (rezef_index < rezef.length) {
            setTimeout(colorStep, breakTime);
        }
    }

    function startGame() {
        colorsNum = 2;
        startPhase();
    }
    function startPhase(){
        colorsNum++;
        currentBox=0;
        guess_str="";
        rezef_str="";
        rezef=[];
        rezef_tone=[];
        rezef_index=0;
        errCount=0

        createPlacement();
        fillRezef();
        colorStep()
    }
    function repeatPhase(){
        currentBox=0;
        guess_str="";
        rezef_index=0;
        createPlacement();
        colorStep()
    }
    function startNewGame(){
        document.getElementById("startDiv").style.display="none";
        document.getElementById("gameDiv").style.display="block";
        startGame()
    }
    function endGame(){
        document.getElementById("startDiv").style.display="block";
        document.getElementById("gameDiv").style.display="none";
    }
</script>
</body>
</html>
