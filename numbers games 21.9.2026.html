<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>משחק מיון מספרים אקראיים</title>
    <style>
        body {
            direction: rtl;
            font-size: 24px;
            background-color: #befbf9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20px;
            margin: 0;
        }

        .greenText {
            background-color: lightgreen;
            width: 70%;
            margin: 0 auto;
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #startBtn {
            font-size: 22px;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #0288d1;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        #startBtn:hover {
            background-color: #01579b;
        }
    </style>
</head>
<body>

<div id="startDiv">
    <h1 class="greenText">שם המשחק: NUMBERS GAME!</h1>
    <button id="startBtn">התחל משחק (Start)</button>
</div>

</body>
</html>
