<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>משחק מיון מספרים אקראיים</title>
    <style>
        body {
            direction: rtl;
            font-size: 24px;
            background-color: #befbf9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20px;
            margin: 0;
        }

        .greenText {
            background-color: lightgreen;
            width: 70%;
            margin: 0 auto;
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #startBtn {
            font-size: 22px;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #0288d1;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        #startBtn:hover {
            background-color: #01579b;
        }

        .gridPanel {
            width: 220px;
            position: fixed;
            top: 150px;
            right: 25px;
            background-color: lightblue;
            border-radius: 10px;
            padding: 15px;
            font-size: 20px;
            text-align: right;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 100;
        }

        #gameDiv {
            display: none;
        }

        .numbers_container {
            margin: 40px auto;
            width: 650px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            padding: 10px;
        }

        .numberBox {
            background-color: white;
            border: 2px solid black;
            padding: 25px 10px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="gridPanel">
    <div>זמן נוכחי: <span id="timeDisplay">0.0</span> שניות</div>
    <div>שיא אישי: <span id="bestTimeDisplay">--</span> שניות</div>
    <div>טעויות: <span id="mistakeDisplay">0</span> / 3</div>
</div>

<div id="startDiv">
    <h1 class="greenText">שם המשחק: NUMBERS GAME!</h1>
    <button id="startBtn">התחל משחק (Start)</button>
</div>

<div id="gameDiv">
    <h1 class="greenText">לחץ על המספרים מהקטן אל הגדול!</h1>
    <div id="gameBoard" class="numbers_container"></div>
</div>

<script>
    let startTime = 0;
    let bestTime = null;
    let mistakes = 0;

    let numbersArray = [];
    let sortedArray = [];

    const timeDisplay = document.getElementById("timeDisplay");
    const bestTimeDisplay = document.getElementById("bestTimeDisplay");
    const mistakeDisplay = document.getElementById("mistakeDisplay");
    const startDiv = document.getElementById("startDiv");
    const gameDiv = document.getElementById("gameDiv");
    const startBtn = document.getElementById("startBtn");
    const gameBoard = document.getElementById("gameBoard");

    startBtn.addEventListener("click", function() {
        startDiv.style.display = "none";
        gameDiv.style.display = "block";
    });
</script>

</body>
</html>
